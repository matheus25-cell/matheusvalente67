<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contato | Matheus Valente</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* Estilos base de segurança */
    body {
      background-color: #0F111A;
      color: #FFFFFF;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    /* Container Centralizador da Página */
    .secao-contato-central {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Cartão Principal de Contato */
    .cartao-contato {
      background: rgba(22, 26, 38, 0.95);
      border: 1px solid rgba(123, 44, 191, 0.5);
      border-radius: 20px;
      padding: 50px 35px;
      max-width: 850px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 25px rgba(123, 44, 191, 0.2);
    }

    /* Lista dos Botões */
    .contatos-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 35px;
      align-items: center;
    }

    /* Estilo Geral dos Botões */
    .contato-link-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      width: 100%;
      max-width: 480px;
      padding: 16px 28px;
      background: rgba(30, 35, 52, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    /* Caixinha do Ícone SVG */
    .icone-box {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .icone-box svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* Estilização Específica do WhatsApp */
    .contato-whatsapp .icone-box {
      background: rgba(37, 211, 102, 0.15);
      color: #25D366;
    }
    .contato-whatsapp:hover {
      border-color: #25D366;
      background: rgba(37, 211, 102, 0.12);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
    }

    /* Estilização Específica do Instagram */
    .contato-instagram .icone-box {
      background: rgba(225, 48, 108, 0.15);
      color: #E1306C;
    }
    .contato-instagram:hover {
      border-color: #E1306C;
      background: rgba(225, 48, 108, 0.12);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(225, 48, 108, 0.3);
    }

    /* Estilização Específica da Localização */
    .contato-localizacao .icone-box {
      background: rgba(0, 229, 255, 0.15);
      color: #00E5FF;
    }
    .contato-localizacao:hover {
      border-color: #00E5FF;
      background: rgba(0, 229, 255, 0.12);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 229, 255, 0.3);
    }
  </style>

</head>

<body>


<!-- CABEÇALHO -->

      </div>

      <!-- MENU INTERATIVO -->

        <summary class="dropbtn" style="font-size: 1.5rem; cursor: pointer; color: #FFFFFF;">
          ☰ Menu
        </summary>

        <div class="dropdown-content">

          <a href="videos.html" style="font-size: 1.3rem;">

          </a>

          <a href="contato.html" style="font-size: 1.3rem;">
            📞 Meu contato

        </div>

      </details>

    </div>

  </div>

</header>

</main>
