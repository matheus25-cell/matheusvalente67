<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matheus Valente | Início</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
</head>

<body>


<!-- CABEÇALHO -->

<header style="position: relative; min-height: 90px; display: flex; align-items: center; justify-content: center;">

  <!-- FOTO DE MATHEUS -->
  <img
    class="cabecalho_imagem"
    src="foto cabelo matheus.png.jpg"
    alt="Foto de Matheus"
    style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%);"
  >

  <!-- NOME CENTRALIZADO -->
  <h1 class="titulo_site" style="text-align: center; margin: 0; width: 100%; font-size: 32px;">
    Matheus do Campo Valente
  </h1>

  <!-- INSTAGRAM À ESQUERDA DO MENU NO CANTO DIREITO -->
  <div style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 15px;">

    <!-- INSTAGRAM -->
    <div class="sociais">

      <a
        href="https://www.instagram.com/046_valente/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <img
          class="estudante-icone"
          src="logo insta roxo.png.jpg"
          alt="Instagram de Matheus"
        >

      </a>

    </div>

    <!-- MENU -->
    <details class="dropdown">

      <summary class="dropbtn">
        ☰ Menu
      </summary>

      <div class="dropdown-content">

        <a href="index.html">
          Início
        </a>

        <a href="sobre.html">
          Sobre mim
        </a>

        <a href="fotos.html">
          Minhas fotos
        </a>

        <a href="videos.html">
          Meus vídeos
        </a>

        <a href="contato.html">
          Meu contato
        </a>

      </div>

    </details>

  </div>

</header>


<!-- BANNER -->

<section class="banner1" style="text-align: center;">

  <img
    src="banner4.jpg"
    alt="Banner da página"
  >

</section>


<!-- APRESENTAÇÃO MAIOR E OBJETIVA -->

<section class="pagina-inicial" style="text-align: center; padding: 30px 20px;">

  <h2 style="font-size: 36px; margin-bottom: 15px;">
    Bem-vindo ao meu site
  </h2>

  <p style="font-size: 22px; max-width: 800px; margin: 0 auto; line-height: 1.6;">
    Este é o meu portal pessoal. Aqui você encontra minhas fotos, vídeos, informações sobre mim e canais de contato.
  </p>

</section>


<!-- VÍDEO DO YOUTUBE NO FINAL -->

<section class="video-youtube-container" style="text-align: center;">

  <h2 style="font-size: 32px;">
    Meu vídeo
  </h2>

  <div class="video-wrapper">

    <iframe
      src="https://www.youtube.com/embed/7ewUbj9v3s8"
      title="Vídeo do YouTube"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>

  </div>

</section>


<!-- RODAPÉ -->

<footer class="escola" style="text-align: center;">

  <p style="font-size: 18px;">
    © 2026 | Matheus do Campo Valente
  </p>

</footer>


</body>
</html>
