<body>


<!-- CABEÇALHO -->

<header>

  <div class="cabecalho-itens">

    <img
      class="cabecalho_imagem"
      src="foto cabelo matheus.png.jpg"
      alt="Foto de Matheus"
    >

    <h1 class="titulo_site">
      Meus Vídeos
    </h1>


    <!-- MENU INTERATIVO -->

    <details class="dropdown">

      <summary class="dropbtn">
        ☰ Menu
      </summary>

      <div class="dropdown-content">

        <a href="index.html">
          🏠 Início
        </a>

        <a href="sobre.html">

        <a href="fotos.html">

        <a href="contato.html">
          📞 Meu contato
        </a>

      </div>

    </details>

  </div>

</header>


<!-- VÍDEOS -->

<section class="estudante">

  <h2 class="estudante_titulo">
    🎬 Meus vídeos
  </h2>


  <div class="estudantes_todos">


    <!-- VÍDEO 1 -->

    <div class="estudante-div">

      <video
        class="video"
        controls
        muted
        loop
        playsinline
      >

        <source
          src="suicida.mp4"
          type="video/mp4"
        >

        Seu navegador não suporta vídeos.

      </video>

      <h3 class="estudante-nome">
        Vídeo 1
      </h3>

    </div>


    <!-- VÍDEO 2 -->

    <div class="estudante-div">

      <video
        class="video"
        controls
        muted
        loop
        playsinline
      >

        <source
          src="suicida2.mp4"
          type="video/mp4"
        >

        Seu navegador não suporta vídeos.

      </video>

      <h3 class="estudante-nome">
        Vídeo 2
      </h3>

    </div>


    <!-- VÍDEO DO YOUTUBE -->

    <div class="estudante-div">

      <div class="video-wrapper">

        <iframe
          src="https://www.youtube.com/embed/7ewUbj9v3s8"
          title="Vídeo do YouTube"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>

      </div>

      <h3 class="estudante-nome">
        YouTube
      </h3>

    </div>


  </div>

</section>


<!-- RODAPÉ -->

<footer class="escola">
