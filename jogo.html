<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Realista | Matheus Valente</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0F111A;
      color: #FFFFFF;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .secao-jogo-central {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .cartao-jogo {
      background: rgba(22, 26, 38, 0.95);
      border: 1px solid rgba(123, 44, 191, 0.5);
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 25px rgba(123, 44, 191, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .placar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 320px;
      margin-bottom: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      background: rgba(30, 35, 52, 0.8);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(0, 229, 255, 0.3);
      box-sizing: border-box;
    }

    .placar span {
      color: #00E5FF;
    }

    #canvasTetris {
      display: block !important;
      background-color: #08090E !important;
      border: 3px solid #7B2CBF;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(123, 44, 191, 0.5);
      max-width: 100%;
      height: auto;
    }

    .btn-reiniciar {
      margin-top: 15px;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #FFFFFF;
      background: linear-gradient(135deg, #7B2CBF, #9D4EDD);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
    }

    .btn-reiniciar:hover {
      background: linear-gradient(135deg, #00E5FF, #7B2CBF);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
    }

    /* Botoeira Mobile */
    .controles-mobile {
      display: grid;
      grid-template-columns: repeat(4, 55px);
      grid-template-rows: repeat(2, 45px);
      gap: 8px;
      margin-top: 15px;
      justify-content: center;
    }

    .btn-control {
      background: rgba(30, 35, 52, 0.9);
      border: 1px solid #00E5FF;
      color: #00E5FF;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .btn-control:active {
      background: #00E5FF;
      color: #0F111A;
    }

    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-rotate { grid-column: 2 / span 2; grid-row: 1; width: 100%; }
    .btn-drop { grid-column: 4; grid-row: 2; }

    .dropdown-content a {
      color: #FFFFFF !important;
      background-color: #161A26 !important;
      padding: 10px 15px;
      display: block;
      text-decoration: none;
    }
    .dropdown-content a:hover {
      background-color: #7B2CBF !important;
      color: #00E5FF !important;
    }
  </style>
</head>

<body>

<!-- CABEÇALHO -->
<header>
  <div class="cabecalho-itens" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 20px;">

    <img class="cabecalho_imagem" src="foto cabelo matheus.png.jpg" alt="Foto de Matheus">

    <h1 class="titulo_site" style="flex: 1; text-align: center; margin: 0; font-size: 2.8rem; color: #00E5FF;">
      Tetris 3D
    </h1>

    <div style="display: flex; align-items: center; gap: 15px;">
      <div class="sociais">
        <a href="https://www.instagram.com/046_valente/" target="_blank" rel="noopener noreferrer">
          <img class="estudante-icone" src="logo insta roxo.png.jpg" alt="Instagram de Matheus">
        </a>
      </div>
    </div>

  </div>
</header>

<!-- SEÇÃO DO JOGO -->
<main class="secao-jogo-central">
  <div class="cartao-jogo">
    <h2 style="font-size: 2.2rem; color: #7B2CBF; margin-top: 0; margin-bottom: 12px;">
      🎮 Tetris Realista
    </h2>

    <div class="placar">
      <div>Pontos: <span id="pontos">0</span></div>
      <div>Linhas: <span id="linhas">0</span></div>
    </div>

    <!-- TELA DO JOGO (10 colunas x 20 linhas) -->
    <canvas id="canvasTetris" width="240" height="480"></canvas>

    <button class="btn-reiniciar" id="btnReiniciar">Novo Jogo</button>

    <!-- BOTOEIRA PARA CELULAR -->
    <div class="controles-mobile">
      <button class="btn-control btn-rotate" id="btnRotate">🔄 Girar</button>
      <button class="btn-control btn-left" id="btnLeft">◄</button>
      <button class="btn-control btn-down" id="btnDown">▼</button>
      <button class="btn-control btn-right" id="btnRight">►</button>
      <button class="btn-control btn-drop" id="btnDrop">⬇</button>
    </div>
  </div>
</main>

<!-- RODAPÉ -->
<footer class="escola" style="text-align: center; padding: 40px 20px;">
  <p style="font-size: 1.3rem; text-align: center; color: #FFFFFF;">
    © 2026 | Matheus do Campo Valente. Todos os direitos reservados.
  </p>
</footer>
